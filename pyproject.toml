[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-factory"
version = "0.1.0"
description = "Project-agnostic Factory Core: offline task-graph validation and dependency planning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.scripts]
factory = "factory.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]  # line length is owned by the formatter; long messages stay on one line
